[project]
name = "documind-ai-worker"
version = "0.1.0"
description = "Document processing worker for DocuMind"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "aiokafka>=0.11",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "minio>=7.2",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "python-docx>=1.1",
    "markdown>=3.7",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.3",
    "torch>=2.6,<2.8",
    "httpx>=0.27",
    "pypdf>=5.1",
    "python-multipart>=0.0.20",
    "redis[hiredis]>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
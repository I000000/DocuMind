global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'gateway'

  - job_name: 'document-service'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'document-service'

  - job_name: 'ai-worker'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'ai-worker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']